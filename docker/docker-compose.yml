services:
  #
  # SuPA
  #
  supa:
    image: ghcr.io/workfloworchestrator/supa:latest@sha256:20806405bdd803c46263d028de631e4e1a665a5568984af8212121c2a5ebc5d9
    configs:
      - source: supa.env
        target: /usr/local/etc/supa/supa.env
    volumes:
      - .:/usr/local/var
    ports:
      - "4321:4321"
    depends_on:
      create-database-folder:
        condition: service_completed_successfully
      polynsi:
        condition: service_started
  #
  # PolyNSI
  #
  polynsi:
    image: ghcr.io/workfloworchestrator/polynsi:latest@sha256:69327c8ad4fd2eec192efd7a2e84cebe41d20cdc6e43537f367dd1ce02ac503e
    ports:
      - "8443:8443"
    configs:
      - source: application.properties
        target: /usr/local/polynsi/application.properties
      - source: polynsi-keystore.jks
        target: /usr/local/polynsi/polynsi-keystore.jks
      - source: polynsi-truststore.jks
        target: /usr/local/polynsi/polynsi-truststore.jks
    volumes:
      - ./tmp:/tmp:rw
  #
  # create SuPA database folder
  #
  create-database-folder:
    image: 'busybox:latest@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4'
    command: ["sh", "-c", "test -d /usr/local/var/db || mkdir /usr/local/var/db"]
    volumes:
      - .:/usr/local/var
configs:
  supa.env:
    file: ./supa.env
  application.properties:
    file: ./application.properties
  polynsi-keystore.jks:
    file: ./polynsi-keystore.jks
  polynsi-truststore.jks:
    file: ./polynsi-truststore.jks
