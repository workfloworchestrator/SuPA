name: Unit tests
on:
  push:
  workflow_dispatch:

jobs:
  container_job:
    # The sqlite jobs keep the "Unit tests (3.x)" names that the main branch ruleset requires.
    name: Unit tests (${{ matrix.python-version }}${{ matrix.database == 'postgresql' && ', postgresql' || '' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        database: ["sqlite", "postgresql"]
      fail-fast: true
    container: ubuntu:latest@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    services:
      postgres:
        image: postgres:18-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
        env:
          POSTGRES_USER: supa
          POSTGRES_PASSWORD: supa
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Empty for sqlite, so tests/conftest.py uses a temporary SQLite file.
      TEST_DATABASE_URI: ${{ matrix.database == 'postgresql' && 'postgresql://supa:supa@postgres/supa-test' || '' }}
    steps:
      - name: Install git so the checkout is a git clone
        run: |
          apt update
          apt install --no-install-recommends --yes ca-certificates git

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          apt update
          apt install --no-install-recommends --yes bash curl git gpg ca-certificates # needed by codecov below
          uv sync --link-mode=copy --dev  # editable install so coverage can be generated

      - name: Run Unit tests
        run: uv run pytest --cov-report term-missing --cov-report=xml --cov=src tests

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
