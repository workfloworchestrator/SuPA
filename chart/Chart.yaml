apiVersion: v2
name: supa
description: SURF Network Service Interface ultimate Provider Agent

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Placeholders only. The chart version and appVersion are both the release git
# tag, injected by .github/workflows/chart.yml:
#     helm package --version $TAG --app-version $TAG
# Do not maintain these numbers by hand. 0.0.0 sorts below every release and
# names an image tag that does not exist, so a mis-built chart fails loudly.
version: 0.0.0

appVersion: "0.0.0"

annotations:
  org.opencontainers.image.source: https://github.com/workfloworchestrator/SuPA
